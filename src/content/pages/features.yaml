# A concise tour of the choices Villow gives viewers and why they matter.
title: How it works
description: Shape your feed, watch on your terms, understand your time and find a good place to stop.

blocks:
  - type: hero
    eyebrow: How it works
    title: You choose how YouTube fits into your day.
    lead: Shape what you see, decide what deserves your time, and leave with something better than another hour of scrolling.

  - type: feature
    id: feed
    heading: Your feed, your way
    image: featureFeed
    what: |
      Your subscriptions, shaped channel by channel. Keep the videos you want and filter out the rest, so the feed feels worth choosing over the endless recommendation loop.

  - type: feature
    id: sorting
    heading: Give each video a moment
    image: featureSorting
    what: |
      Treat your feed like a list: give each video a moment, then skip it, save it for later or add it to a playlist. That small decision makes watching feel deliberate and satisfying.

  - type: feature
    id: rating
    heading: Was it worth your time?
    image: featureRating
    what: |
      After a video, Villow asks: **“Was this worth your time?”** Answering is quick and optional. Over time, your answers show what you value alongside how long you watched.

  - type: feature
    id: time
    heading: See where your time went
    image: featureTime
    what: |
      - See your watching by day, channel and time of day. Viewing Review shows each video and whether you found it worth your time.
      - Follow your daily average and the share of videos you found worth it, so you can see how your habits change.
    tagline: Seeing the pattern helps you decide what to change.

  - type: feature
    id: suggestions
    heading: An algorithm that works for you
    image: featureSuggestions
    what: |
      Villow spots patterns in what you watch, skip and rate, then suggests changes to your feed or limits. Every suggestion explains why; you decide whether to use it. That helps you find the right control when you aren't sure what to change.

  - type: feature
    id: limits
    heading: Limits that fit real life
    image: featureLimits
    what: |
      - Set watch limits, schedules, bedtime and breaks that fit your day.
      - If a limit arrives mid-video, you can finish it. Leave whenever you want, and your place is saved for later.
    tagline: Saved progress makes leaving less frustrating, so limits are easier to keep.

  - type: section
    id: momentum
    heading: A reason to stop
    body: |
      - A streak marks the days you kept your own watch limit.
      - Opt in with friends to see group watch time and keep a shared streak.
    tagline: A streak gives you a small reward for stopping when you planned to.

  - type: feature
    id: friends
    heading: Find common ground
    image: featureFriends
    what: |
      - **Popular in Your Country Today:** See what people across your country are watching beyond your usual feed.
      - **Videos from friends:** Recommend a video and see whether a friend watched and liked it, so you have something to discuss. Share your own activity only if you choose.
    tagline: Shared videos give people something to talk about beyond their own feeds.

  - type: feature
    id: real-life
    heading: Back to real life
    image: featureRealLife
    what: |
      - Your to-do list returns at natural stopping points, ready when you want to do something else.
      - **Creator calls to action** {status:creator-cta} could put a next step beside a video, ready for your list. This needs YouTube Studio.
    tagline: A clear next step can turn a conversation into action.
    actions:
      - label: More on creator calls to action →
        href: /creators
        style: text

  - type: feature
    id: disinformation
    eyebrow: "An idea for YouTube {status:community-notes}"
    heading: Corrections that reach everyone
    image: featureCommunityNotes
    what: |
      - A Community Note would appear beside a video when people with different viewpoints agree it adds needed context.
      - If a note arrives later, everyone who already watched gets a notice that stays until they read it.
    tagline: A correction needs to reach the people who saw the claim.

  - type: feature
    id: extension
    heading: Take your limits onto YouTube
    image: featureExtension
    what: |
      Villow can't show YouTube's own recommendations inside the app. The extension puts limits and calmer settings where that feed lives, so you can explore it on your terms.
    actions:
      - label: All about the extension →
        href: /extension
        style: text

  - type: feature
    id: appearance
    heading: Make it yours
    image: featureAppearance
    what: |
      Choose how Villow looks and feels, from thumbnails and motion to colours and icons. When the app feels good to use, choosing your own feed takes less effort.

  - type: cta
    variant: fixtheweb
    heading: Every one of these is something YouTube could offer.
    body: Villow was built on YouTube's public API, from the outside. Fix the Web is asking platforms to build controls like these in, for everyone.
    actions:
      - label: See what we're asking platforms to change →
        href: link:fixTheWeb
        style: primary
      - label: YouTube could do this →
        href: /youtube-could-do-this
        style: text

  - type: cta
    heading: Ready for your own Villow?
    actions:
      - label: Download Villow
        href: /download
        style: primary
      - label: Read the FAQ →
        href: /faq
        style: text
