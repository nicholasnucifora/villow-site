# A concise tour of the choices Villow gives viewers and why they matter.
title: How it works
description: Shape your feed, watch on your terms, understand your time and find a good place to stop.

blocks:
  - type: hero
    eyebrow: How it works
    title: You choose how YouTube fits into your day.
    lead: Shape what you see, decide what deserves your time, and leave with something better than another hour of scrolling.

  - type: toc
    heading: On this page

  - type: feature
    id: feed
    heading: Your feed, your way
    image: featureFeed
    what: |
      Your subscriptions are still the heart of the feed. You decide what you see from each channel and how often it appears, and the feed has an end.

      Optional sections bring in videos friends recommend, videos you save from YouTube, and what's popular across your country. They give you more to talk about beyond your usual corner of YouTube.
    tagline: A familiar feed you can tend, and finish.

  - type: feature
    id: sorting
    heading: Give each video a moment
    image: featureSorting
    what: |
      On mobile, swipe through videos one at a time: skip one, save it to Watch Later or add it to a playlist. Sorting feels like clearing a list, with room to decide what deserves your attention.

  - type: feature
    id: rating
    heading: Was it worth your time?
    image: featureRating
    what: |
      After a video, Villow asks one quick question: **“Was this worth your time?”** Your answers, along with what you skip, help you see what you actually enjoy.

  - type: feature
    id: time
    heading: See where your time went
    image: featureTime
    what: |
      See how much time you spend watching, which channels fill it, and the hours and days you tend to watch. Your Viewing Review lays out each day, video by video, including whether it felt worth it. Time on YouTube can count too when you link the extension.

  - type: feature
    id: suggestions
    heading: An algorithm that works for you
    image: featureSuggestions
    what: |
      Villow spots patterns in what you watch, skip and rate, then suggests changes to your channels, filters or limits. Each suggestion shows its reasons. You choose whether to use it, and Villow never suggests raising a limit.
    tagline: An algorithm on your side, with its working in plain sight.

  - type: feature
    id: limits
    heading: Limits that fit real life
    image: featureLimits
    what: |
      Set a daily watch limit, a schedule and a bedtime, with breaks when you need them. Villow shows when a video would run past your time left. If your limit arrives mid-video, you can finish it or leave and pick up where you stopped.

  - type: section
    id: momentum
    heading: A reason to stop
    body: |
      Your streak marks the days you stuck to your limit. With friends who opt in, you can see your group's watch time and keep a shared streak or limit. Your settings are always yours to change.

  - type: feature
    id: friends
    heading: Share with friends
    image: featureFriends
    what: |
      Send a video to a friend and see whether they watched and liked it. Share parts of your own watching or settings only if you choose. Nothing is shared by default.
    tagline: A video worth sharing can start a real conversation.

  - type: feature
    id: real-life
    heading: Back to real life
    image: featureRealLife
    what: |
      Keep a to-do list beside what you watch. It comes back at natural stopping points, when you're ready to do something else.

      A **creator call to action** {status:creator-cta} showcase imagines one clear next step beside a video, where you could add it to your list. This would need to be built into YouTube Studio.
    tagline: A clear next step can turn a conversation into action.
    actions:
      - label: More on creator calls to action →
        href: /creators
        style: text

  - type: feature
    id: disinformation
    eyebrow: "An idea for YouTube {status:community-notes}"
    heading: Corrections that reach everyone
    image: featureCommunityNotes
    what: |
      Imagine Community Notes on YouTube, backed by people with different viewpoints. A note would appear beside the video. If it arrived later, everyone who had already watched would get a notice that stays until they read it.
    tagline: A correction should reach the people who saw the claim.

  - type: feature
    id: extension
    heading: Take your limits onto YouTube
    image: featureExtension
    what: |
      YouTube's recommendations can't appear inside Villow, so the browser extension brings your limits to YouTube itself. In Chrome, Edge and Firefox, you can cap your browsing or watching, calm the page, and save videos to Villow instead of playing them straight away.
    actions:
      - label: All about the extension →
        href: /extension
        style: text

  - type: feature
    id: appearance
    heading: Make it yours
    image: featureAppearance
    what: |
      Hide thumbnails, use greyscale or gentler motion, and choose colours and an app icon that feel like yours. The space around the videos should feel good to use, too.

  - type: feature
    id: listening
    heading: Built by listening
    image: featureFeedback
    what: |
      Villow checks in as you use it, and you can send feedback whenever you want. What people say shapes what gets built next.

  - type: cta
    variant: fixtheweb
    heading: Every one of these is something YouTube could offer.
    body: Villow was built on YouTube's public API, from the outside. Fix the Web is asking platforms to build controls like these in, for everyone.
    actions:
      - label: See what we're asking platforms to change →
        href: link:fixTheWeb
        style: primary
      - label: YouTube could do this →
        href: /youtube-could-do-this
        style: text

  - type: cta
    heading: Ready for your own Villow?
    actions:
      - label: Download Villow
        href: /download
        style: primary
      - label: Read the FAQ →
        href: /faq
        style: text
