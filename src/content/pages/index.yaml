title: Watch on purpose
description: Keep the YouTube you value. Choose a finite feed, set boundaries, save your place and learn what felt worthwhile. Run your own private Villow or join someone you trust.

blocks:
  - type: hero
    eyebrow: A Fix the Web project
    title: Watch on purpose.
    lead: Keep the YouTube you value. Build a feed from channels you choose, set boundaries around watching and discovery, and see which videos felt worth your time. Entertainment, learning and rest all count. You decide what worthwhile means.
    actions:
      - label: Get started
        href: /download
        style: primary
      - label: Take a guided tour →
        href: /demo
        style: text
    smallPrint:
      - Free and open source
      - Run your own private Villow, or join one run by someone you trust
      - Villow adds no ads and sells no viewing data
    image: homeHero

  - type: section
    variant: statement
    heading: Catch up, then be done.
    body: A chronological feed from channels you choose, with a size you control and a real end. Keep what interests you, skip the rest, and leave when you've caught up.

  - type: section
    heading: Keep discovering. Choose how much.
    body: Explore country charts and friends' picks in Villow. For YouTube's personalized recommendations, browse YouTube itself with the extension's daily ceiling on recommendations seen. Those recommendations stay on YouTube; Villow's own suggestions help you adjust your habits and settings.
    actions:
      - label: How discovery works →
        href: /extension
        style: text

  - type: steps
    id: the-loop
    eyebrow: How it feels
    heading: Choose, sort, watch, reflect.
    layout: row
    items:
      - title: Choose
        body: Pick your channels, filters and how often each channel checks in.
        image: loopChoose
      - title: Sort
        body: Swipe to skip or save. Your library can have limits too.
        image: loopSort
      - title: Watch
        body: Enjoy a calm player. Stop now and pick up where you left off.
        image: loopWatch
      - title: Check in, if you like
        body: "One quick, optional question: *was this worth your time?* You never have to rate."
        image: loopRate
      - title: Reflect & refine
        body: See patterns in your time and ratings, with explained suggestions you can accept or dismiss.
        image: loopReflect

  - type: cards
    id: highlights
    eyebrow: What's inside
    heading: More say over your day.
    items:
      - title: Channels, on your terms
        href: /features#feed
        body: Keep a channel's tutorials, exclude a series you skip, choose a duration range, or catch up with it weekly. A few choices shape the feed around you.
      - title: Your limits follow you
        href: /extension#coverage
        body: Your limits follow you across Villow and connected browsers. Count Villow usage and YouTube pages in browsers with the linked extension; native YouTube apps and unconnected browsers are outside that coverage.
      - title: Stop now. Pick up where you left off.
        href: /features#limits
        body: Saved progress gives a video somewhere to wait. Optional Watch Later size limits, expiry and pinning help keep the library manageable.
      - title: Suggestions that show their reasons
        href: /features#suggestions
        body: Your ratings, skips and usage can point to an adjustment. Villow waits for a sufficient pattern, explains it, and leaves the decision to you.
      - title: Built for friends, not followers
        href: /features#friends
        body: Recommend a video, share what you choose, or watch together in a private room with synchronized playback, a shared queue and chat.
      - title: Something else you'd enjoy
        href: /features#real-life
        body: Bring in your own activities from Google Tasks or Todoist. At a natural stopping point, they're an invitation to do what matters to you, including rest.
    actions:
      - label: See every feature →
        href: /features
        style: text

  - type: spotlight
    id: suggestions
    eyebrow: An algorithm that works for you
    heading: Not just how long. Whether it was worth it.
    body: Time alone can't tell you whether a video was worthwhile. Optional reflections add your perspective. When enough of your ratings and usage show a pattern, Villow suggests a change, such as checking a channel less often, and shows why. You choose whether to act. It never suggests raising a limit.
    image: spotlightTime
    actions:
      - label: How suggestions work →
        href: /features#suggestions
        style: text

  - type: spotlight
    id: limits
    eyebrow: Boundaries you choose
    heading: A good place to stop.
    body: Daily and per-channel limits, schedules, bedtime and enforced breaks help you keep the boundaries you chose. A finish-current-video allowance is available for some limits when the app offers it. Streaks count days without raising or extending limits, rather than simply days below a time threshold.
    image: spotlightLimits
    imageSide: left
    actions:
      - label: Limits and saved progress →
        href: /features#limits
        style: text

  - type: section
    id: your-villow
    heading: Your own private Villow. Your people.
    body: One person sets up a Villow on hosting and database accounts they control, then friends sign in. You can run your own or join one run by someone you trust. The owner controls the database; your member sharing choices decide what other members see through the app.
    actions:
      - label: Create one or join a friend's →
        href: /download
        style: primary
      - label: Understand the privacy model →
        href: /privacy-overview
        style: text

  - type: cta
    variant: fixtheweb
    heading: YouTube could offer these controls to everyone.
    body: Villow demonstrates that these controls are possible. YouTube could offer them directly to everyone. Fix the Web is building the case through working tools and voluntary feedback. Villow is a prototype we can learn from; better outcomes need evidence, and private viewing data isn't automatically sent to the movement.
    actions:
      - label: Why this matters →
        href: /youtube-could-do-this
        style: primary
      - label: Help it reach more people →
        href: /about#get-involved
        style: text

  - type: cta
    id: get-villow
    heading: Make room for the YouTube you value.
    body: Create a private Villow, join a friend's, or start with the standalone extension. Villow adds no ads and sells no viewing data. Embedded videos may still show YouTube ads.
    actions:
      - label: Get started
        href: /download
        style: primary
      - label: Try the guided tour →
        href: /demo
        style: text
