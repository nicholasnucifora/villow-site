# ─────────────────────────────────────────────────────────────────────────────
# villow.app site config
#
# This file is the to-do list. Anything left empty shows on the site as a
# visible placeholder, so the site always builds and nothing is hidden.
#
#   links:   empty → the link or button shows, marked TBD, and does nothing
#   tbd:     empty value → a pink "TBD" chip showing the note
#   images:  empty src → a labelled frame at the right size and shape
#
# Run `npm run placeholders` to list everything still empty.
# Page copy lives in src/content/, not here.
# ─────────────────────────────────────────────────────────────────────────────

site:
  name: Villow
  url: https://villow.app
  lang: en-AU

# Which look to use. Options: fern, forest, sunset, beach, dusk
# (defined in src/styles/themes.css). In `npm run dev` there's also a picker
# in the corner of every page.
theme: fern

brand:
  logo: # e.g. /brand/villow-logo.svg (put the file in public/brand/)
  favicon: # e.g. /favicon.svg. Until then a placeholder icon is used.
  appIcon: # e.g. /apple-touch-icon.png (180×180)

# ── Links ────────────────────────────────────────────────────────────────────
# Use these in copy as [label](link:key), and in buttons as href: link:key.
links:
  # Fix the Web
  fixTheWeb: https://fixtheweb.org
  discord:
  reddit:
  newsletter:
  howToHelp:

  # Getting Villow
  setupWindows: # Villow Setup download for Windows
  chromeStore:
  edgeAddons:
  firefoxAddons: # the same listing covers Firefox for Android

  # Code
  appSource: # Villow app repository (MIT)
  extensionSource: https://github.com/nicholasnucifora/Villow-Extension

  # Policies and help
  extensionPrivacy: /privacy # the existing extension policy. Don't change.
  appPrivacy: /app-privacy
  terms:
  contact: # The extension policy lists nuciforan+villow@hotmail.com. Use mailto:… if you want that here.

  # Official third-party pages the copy refers to (see LAUNCH_CHECKLIST.md)
  youtubeApiTerms: https://developers.google.com/youtube/terms/api-services-terms-of-service
  youtubeDeveloperPolicies: https://developers.google.com/youtube/terms/developer-policies
  youtubeTerms: https://www.youtube.com/t/terms
  googlePrivacyPolicy: https://policies.google.com/privacy
  googleApiUserDataPolicy: https://developers.google.com/terms/api-services-user-data-policy
  googleSecuritySettings: https://security.google.com/settings/security/permissions # the page YouTube's policies (III.A.2) name for revoking access

# ── Not decided yet ──────────────────────────────────────────────────────────
# Use these in copy as {tbd:key}. Fill in `value` and the chip becomes that text.
tbd:
  setupMinutes:
    note: setup time in minutes
    value:
  setupOtherPlatforms:
    note: macOS and Linux availability
    value:
  paidPlanProviders:
    note: which provider(s) need a paid plan
    value:
  groupSizeGuide:
    note: rough guide to group sizes
    value:
  freeLimitReached:
    note: what happens when a free limit is reached
    value:
  productionMove:
    note: whether Setup covers moving to Production, and what's involved
    value:
  inviteSteps:
    note: exact steps to add a friend in Google Cloud
    value:
  extensionPointsConfirmed:
    note: Nicholas to confirm each point
    value:
  comparisonCheckedDate:
    note: date the comparisons were last checked
    value:
  nicholasBio:
    note: short bio
    value:
  contributing:
    note: how to contribute
    value:
  appPolicyStatus:
    note: draft, not yet reviewed # once it's final, delete {tbd:appPolicyStatus} from privacy-overview.yaml and the notice from app-privacy.yaml
    value:
  appPolicyEffectiveDate:
    note: date this policy takes effect
    value:
  appPolicyGoogleScopes:
    note: which Google account details and YouTube permissions Villow requests, and what each is for
    value:
  appPolicyDeviceStorage:
    note: cookies and browser storage the app uses
    value:
  appPolicyRetention:
    note: how long other data is kept
    value:
  appPolicyDeletion:
    note: how to delete your data or leave a Villow
    value:
  appPolicyMinimumAge:
    note: minimum age
    value:

